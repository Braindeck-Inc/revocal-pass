name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'revocal-pass-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revocal-pass-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: revocal-pass-worker
          # TODO(TJ): 리포 Settings → Secrets and variables → Actions에 아래 두 개 등록
          #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
          # 값은 여기 코드에 절대 하드코딩하지 않음.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
